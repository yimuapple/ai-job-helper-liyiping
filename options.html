<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>个人信息管理 - 秋招AI求职助手</title>
  <link rel="stylesheet" href="options.css">
  <script src="lib/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <span class="logo">📋</span>
        <h1>个人信息管理</h1>
      </div>
      <div class="header-right">
        <span id="saveStatus" class="save-status"></span>
        <button id="saveBtn" class="btn btn-primary">保存</button>
      </div>
    </header>

    <div class="resume-upload">
      <div class="upload-box">
        <span class="upload-icon">📄</span>
        <div class="upload-text">
          <strong>上传简历，AI 自动解析填充</strong>
          <span>支持 PDF · 1 分钟完成首次录入</span>
        </div>
        <input type="file" id="resumeFile" accept=".pdf" style="display:none;">
        <button id="uploadBtn" class="btn btn-primary">选择文件</button>
      </div>
      <div id="parseStatus" class="parse-status" style="display:none;"></div>
      
      <!-- 简历上传提示 -->
      <div style="margin-top: 12px; padding: 12px; background: #f0f5ff; border: 1px solid #d6e4ff; border-radius: 8px; font-size: 13px; color: #2f54eb; line-height: 1.6;">
        <div style="font-weight: 600; margin-bottom: 6px;">💡 简历越全面越好，为什么？</div>
        <div style="color: #555;">
          1. 这里是你的<b>完整经历库</b>，不用针对某个岗位优化<br>
          2. 所有实习/项目/技能/获奖都写上，哪怕你觉得不相关<br>
          3. 后面投不同岗位时，AI会自动挑选最相关的内容生成定制简历<br>
          4. 解析完记得手动检查修正一下，确保信息准确
        </div>
      </div>
    </div>

    <div class="main">
      <nav class="sidebar">
        <div class="nav-item active" data-tab="basic"><span>👤</span> 基本信息</div>
        <div class="nav-item" data-tab="job"><span>🎯</span> 求职意向</div>
        <div class="nav-item" data-tab="education"><span>🎓</span> 教育经历</div>
        <div class="nav-item" data-tab="internship"><span>💼</span> 实习经历</div>
        <div class="nav-item" data-tab="project"><span>🚀</span> 项目经历</div>
        <div class="nav-item" data-tab="skills"><span>🏆</span> 技能证书</div>
      </nav>

      <div class="content">
        <section class="tab-panel active" id="tab-basic">
          <h2>基本信息</h2>
          <div class="form-grid">
            <div class="form-group"><label>姓名 *</label><input type="text" id="name" placeholder="请输入姓名"></div>
            <div class="form-group"><label>手机号 *</label><input type="tel" id="phone" placeholder="请输入手机号"></div>
            <div class="form-group"><label>邮箱 *</label><input type="email" id="email" placeholder="请输入邮箱"></div>
            <div class="form-group"><label>性别</label><select id="gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
            <div class="form-group"><label>出生日期</label><input type="date" id="birthday"></div>
            <div class="form-group"><label>政治面貌</label><select id="politicalStatus"><option value="">请选择</option><option value="中共党员">中共党员</option><option value="中共预备党员">中共预备党员</option><option value="共青团员">共青团员</option><option value="群众">群众</option><option value="其他">其他</option></select></div>
            <div class="form-group"><label>籍贯</label><input type="text" id="hometown" placeholder="如：湖南娄底"></div>
            <div class="form-group"><label>现居住地</label><input type="text" id="currentCity" placeholder="如：湖南长沙"></div>
            <div class="form-group form-full"><label>身份证号</label><input type="text" id="idCard" placeholder="选填，部分网申需要"></div>
            <div class="form-group form-full"><label>自我评价</label><textarea id="selfEvaluation" rows="4" placeholder="用3-5句话概括你的优势，如：具备良好的沟通能力和团队协作精神，熟练使用Excel、PPT等办公软件..."></textarea></div>
          </div>
        </section>

        <section class="tab-panel" id="tab-job">
          <h2>求职意向</h2>
          <div class="form-grid">
            <div class="form-group"><label>期望工作城市</label><input type="text" id="expectedCity" placeholder="如：长沙、深圳、广州（可多选，用逗号分隔）"></div>
            <div class="form-group"><label>期望月薪（税前）</label><input type="text" id="expectedSalary" placeholder="如：8k-12k、10000-15000"></div>
            <div class="form-group"><label>可到岗时间</label><input type="text" id="availableDate" placeholder="如：随时到岗、2024年7月、1个月内"></div>
            <div class="form-group"><label>求职状态</label><select id="jobStatus"><option value="">请选择</option><option value="在校-考虑机会">在校-考虑机会</option><option value="在校-积极找工作">在校-积极找工作</option><option value="应届-积极找工作">应届-积极找工作</option><option value="在职-考虑机会">在职-考虑机会</option><option value="离职-正在找工作">离职-正在找工作</option></select></div>
            <div class="form-group form-full"><label>意向岗位</label><input type="text" id="expectedPosition" placeholder="如：产品经理、产品运营、AI产品经理"></div>
            <div class="form-group form-full"><label>意向行业</label><input type="text" id="expectedIndustry" placeholder="如：互联网、AI、新能源、金融"></div>
          </div>
        </section>

        <section class="tab-panel" id="tab-education">
          <div class="panel-header"><h2>教育经历</h2><button class="btn btn-small" id="addEducation">+ 添加一段</button></div>
          <div id="educationList"></div>
        </section>

        <section class="tab-panel" id="tab-internship">
          <div class="panel-header"><h2>实习经历</h2><button class="btn btn-small" id="addInternship">+ 添加一段</button></div>
          <div id="internshipList"></div>
        </section>

        <section class="tab-panel" id="tab-project">
          <div class="panel-header"><h2>项目经历</h2><button class="btn btn-small" id="addProject">+ 添加一段</button></div>
          <div id="projectList"></div>
        </section>

        <section class="tab-panel" id="tab-skills">
          <h2>技能证书</h2>
          <div class="form-grid">
            <div class="form-group form-full"><label>语言能力</label><input type="text" id="languages" placeholder="如：英语 CET-6 (580)、日语 N2"></div>
            <div class="form-group form-full"><label>专业技能</label><textarea id="professionalSkills" rows="3" placeholder="如：Python、SQL、Excel、PS、SU、AutoCAD"></textarea></div>
            <div class="form-group form-full"><label>证书</label><input type="text" id="certificates" placeholder="如：教师资格证、计算机二级、驾驶证"></div>
            <div class="form-group form-full"><label>获奖经历</label><textarea id="awards" rows="3" placeholder="如：2024年 国家奖学金、2023年 挑战杯省级一等奖"></textarea></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <template id="educationTemplate">
    <div class="entry-card">
      <div class="entry-header"><span class="entry-title">教育经历</span><button class="btn btn-small btn-danger btn-remove">删除</button></div>
      <div class="form-grid">
        <div class="form-group"><label>学校 *</label><input type="text" class="field-school" placeholder="如：湖南大学"></div>
        <div class="form-group"><label>专业 *</label><input type="text" class="field-major" placeholder="如：建筑学"></div>
        <div class="form-group"><label>学历</label><select class="field-degree"><option value="">请选择</option><option value="大专">大专</option><option value="本科">本科</option><option value="硕士">硕士</option><option value="博士">博士</option></select></div>
        <div class="form-group"><label>GPA</label><input type="text" class="field-gpa" placeholder="如：3.8/4.0"></div>
        <div class="form-group"><label>排名</label><input type="text" class="field-rank" placeholder="如：5/120"></div>
        <div class="form-group"><label>开始时间</label><input type="month" class="field-startDate"></div>
        <div class="form-group"><label>结束时间</label><input type="month" class="field-endDate"></div>
        <div class="form-group form-full"><label>主修课程</label><input type="text" class="field-courses" placeholder="如：建筑设计、城市规划、建筑物理"></div>
      </div>
    </div>
  </template>

  <template id="internshipTemplate">
    <div class="entry-card">
      <div class="entry-header"><span class="entry-title">实习经历</span><button class="btn btn-small btn-danger btn-remove">删除</button></div>
      <div class="form-grid">
        <div class="form-group"><label>公司名称 *</label><input type="text" class="field-company" placeholder="如：字节跳动"></div>
        <div class="form-group"><label>岗位 *</label><input type="text" class="field-position" placeholder="如：产品运营实习生"></div>
        <div class="form-group"><label>开始时间</label><input type="month" class="field-startDate"></div>
        <div class="form-group"><label>结束时间</label><input type="month" class="field-endDate"></div>
        <div class="form-group form-full"><label>工作内容</label><textarea class="field-description" rows="3" placeholder="描述你做了什么"></textarea></div>
        <div class="form-group form-full"><label>工作成果</label><textarea class="field-achievements" rows="2" placeholder="量化成果，如：提升效率30%、覆盖用户10万+"></textarea></div>
      </div>
    </div>
  </template>

  <template id="projectTemplate">
    <div class="entry-card">
      <div class="entry-header"><span class="entry-title">项目经历</span><button class="btn btn-small btn-danger btn-remove">删除</button></div>
      <div class="form-grid">
        <div class="form-group"><label>项目名称 *</label><input type="text" class="field-name" placeholder="如：秋招AI求职助手"></div>
        <div class="form-group"><label>担任角色</label><input type="text" class="field-role" placeholder="如：产品负责人、核心开发"></div>
        <div class="form-group"><label>开始时间</label><input type="month" class="field-startDate"></div>
        <div class="form-group"><label>结束时间</label><input type="month" class="field-endDate"></div>
        <div class="form-group form-full"><label>项目描述</label><textarea class="field-description" rows="3" placeholder="项目背景、目标、你的工作"></textarea></div>
        <div class="form-group form-full"><label>项目成果</label><textarea class="field-achievements" rows="2" placeholder="量化成果，如：用户500+、营收1万+、获奖"></textarea></div>
      </div>
    </div>
  </template>

  <script src="options.js"></script>
</body>
</html>
